# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = app/db/migrations

# Use fixed revision filename pattern for predictability
file_template = %%(rev)s_%%(slug)s

# Prepend repo root to sys.path so `app` package is importable
prepend_sys_path = .

version_path_separator = os

# sqlalchemy.url is NOT set here — env.py reads DATABASE_URL from env instead.
# sqlalchemy.url = ...

[post_write_hooks]
# Auto-format generated migration files with black
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
