name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Formatter Check
        run: black --check .

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_secure_password
          POSTGRES_DB: rag_enterprise_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_enterprise_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_secure_password
      POSTGRES_DB: rag_enterprise_db
      DATABASE_URL: postgresql+asyncpg://rag_user:rag_secure_password@localhost:5433/rag_enterprise_db
      POSTGRES_APP_USER: rag_app
      POSTGRES_APP_PASSWORD: rag_app_password
      APP_DATABASE_URL: postgresql+asyncpg://rag_app:rag_app_password@localhost:5433/rag_enterprise_db

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Setup Database (Migrations, Roles, Seed)
        run: |
          alembic upgrade head
          python infra/postgres/apply_roles.py
          python -m app.db.seed

      - name: Run Pytest
        run: pytest -v --ignore=tests/test_migrations.py

  migration-check:
    name: Migration Smoke Test (upgrade → downgrade → upgrade)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Migration Smoke Test
        # Docker daemon is available on ubuntu-latest (GitHub-hosted runners).
        # testcontainers pulls pgvector/pgvector:pg16 and spins it up for the test.
        run: pytest -v tests/test_migrations.py
